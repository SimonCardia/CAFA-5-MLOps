services:
  cafa-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: cafa-api:local
    working_dir: /app/services/inference-api
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/services/inference-api
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    ports:
      - "8001:8000"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
